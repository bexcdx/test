name: Build Telegram Bot API - Linux Only 1

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux-static:
    name: Build Linux Static (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build static binary for ${{ matrix.arch }}
        run: |
          cat > Dockerfile << 'EOF'
          FROM alpine:latest AS builder
          
          RUN apk add --no-cache \
              git cmake make g++ \
              openssl-dev openssl-libs-static \
              zlib-dev zlib-static \
              linux-headers gperf
          
          WORKDIR /app
          RUN git clone --recursive https://github.com/tdlib/telegram-bot-api.git
          
          WORKDIR /app/telegram-bot-api/build
          
          RUN cmake -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_INSTALL_PREFIX=/output \
                    -DOPENSSL_USE_STATIC_LIBS=TRUE \
                    -DOPENSSL_ROOT_DIR=/usr \
                    -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/libcrypto.a \
                    -DOPENSSL_SSL_LIBRARY=/usr/lib/libssl.a \
                    -DZLIB_LIBRARY=/usr/lib/libz.a \
                    -DCMAKE_EXE_LINKER_FLAGS="-static" \
                    .. && \
              cmake --build . --target install -j$(nproc) && \
              strip /output/bin/telegram-bot-api
          
          FROM scratch
          COPY --from=builder /output /output
          EOF
          
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --output type=local,dest=./output \
            -f Dockerfile .
          
          cd output
          tar -czf ../telegram-bot-api-linux-${{ matrix.arch }}-static.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-static
          path: telegram-bot-api-linux-${{ matrix.arch }}-static.tar.gz

  release:
    name: Create Release
    needs: [build-linux-static]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -name "*.tar.gz" -exec cp {} release/ \;
          ls -lah release/

      - name: Create checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release (Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## 🐧 Linux Static Binaries
            
            Fully static binaries for Linux - no dependencies required!
            
            **Downloads:**
            - `telegram-bot-api-linux-amd64-static.tar.gz` - x86_64
            - `telegram-bot-api-linux-arm64-static.tar.gz` - ARM 64-bit
            - `telegram-bot-api-linux-armv7-static.tar.gz` - ARM 32-bit
            
            **Usage:**
            ```bash
            tar -xzf telegram-bot-api-linux-amd64-static.tar.gz
            cd bin
            ./telegram-bot-api --api-id=YOUR_ID --api-hash=YOUR_HASH
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (Branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: release/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
