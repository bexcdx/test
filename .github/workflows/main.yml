name: Build Telegram Bot API - Linux Only

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux-static:
    name: Build Linux Static (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build static binary for ${{ matrix.arch }}
        run: |
          cat > Dockerfile << 'EOF'
          FROM alpine:latest AS builder
          
          # Install build dependencies
          RUN apk add --no-cache \
              git \
              cmake \
              make \
              g++ \
              openssl-dev \
              openssl-libs-static \
              zlib-dev \
              zlib-static \
              linux-headers \
              gperf
          
          # KEY FIX: Remove dynamic libraries to force static linking
          RUN rm -f /usr/lib/libssl.so* \
                    /usr/lib/libcrypto.so* \
                    /usr/lib/libz.so* \
                    /lib/libz.so*
          
          # Verify only static libs remain
          RUN echo "=== Available OpenSSL libs ===" && \
              ls -la /usr/lib/libssl* /usr/lib/libcrypto* 2>/dev/null || true && \
              echo "=== Available zlib ===" && \
              ls -la /usr/lib/libz* /lib/libz* 2>/dev/null || true
          
          WORKDIR /app
          
          # Clone repository
          RUN git clone --recursive https://github.com/tdlib/telegram-bot-api.git
          
          WORKDIR /app/telegram-bot-api/build
          
          # Configure and build with static linking
          RUN cmake -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_INSTALL_PREFIX=/output \
                    -DCMAKE_EXE_LINKER_FLAGS="-static" \
                    -DOPENSSL_USE_STATIC_LIBS=TRUE \
                    -DZLIB_USE_STATIC_LIBS=ON \
                    .. && \
              cmake --build . --target install -j$(nproc)
          
          # Strip binary to reduce size
          RUN strip /output/bin/telegram-bot-api
          
          # Verify it's truly static
          RUN echo "=== Binary Info ===" && \
              file /output/bin/telegram-bot-api && \
              ls -lh /output/bin/telegram-bot-api && \
              echo "=== Checking dependencies ===" && \
              (ldd /output/bin/telegram-bot-api 2>&1 || echo "No dynamic dependencies") && \
              if ldd /output/bin/telegram-bot-api 2>&1 | grep -q "not a dynamic\|statically linked"; then \
                echo "✅ SUCCESS: Fully static binary!"; \
              elif ldd /output/bin/telegram-bot-api 2>&1 | grep -q "not found"; then \
                echo "❌ ERROR: Missing dependencies"; exit 1; \
              else \
                echo "⚠️ WARNING: May have some dependencies"; \
              fi
          
          FROM scratch
          COPY --from=builder /output /output
          EOF
          
          # Build for specific architecture
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --output type=local,dest=./output \
            --progress=plain \
            -f Dockerfile .
          
          # Create archive
          cd output
          tar -czf ../telegram-bot-api-linux-${{ matrix.arch }}-static.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-static
          path: telegram-bot-api-linux-${{ matrix.arch }}-static.tar.gz

  release:
    name: Create Release
    needs: [build-linux-static]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -name "*.tar.gz" -exec cp {} release/ \;
          ls -lah release/

      - name: Create checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release (Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## 🐧 Linux Static Binaries - No Dependencies!
            
            All binaries are **fully static** - works on any Linux distro without installing libraries!
            
            ### 📦 Downloads:
            - **amd64** (x86_64): `telegram-bot-api-linux-amd64-static.tar.gz` ⭐ Most common
            - **arm64** (aarch64): `telegram-bot-api-linux-arm64-static.tar.gz` - For ARM servers/Pi 4
            - **armv7**: `telegram-bot-api-linux-armv7-static.tar.gz` - For Raspberry Pi 3
            
            ### 🚀 Quick Start:
            ```bash
            # Download & extract
            tar -xzf telegram-bot-api-linux-amd64-static.tar.gz
            cd bin
            
            # Run (no installation needed!)
            ./telegram-bot-api --api-id=YOUR_ID --api-hash=YOUR_HASH
            ```
            
            ### ✅ Verified Static:
            ```bash
            ldd telegram-bot-api
            # Output: "not a dynamic executable"
            ```
            
            ### 🔒 Verify integrity:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (Branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Linux Static Build ${{ github.run_number }}
          files: release/*
          generate_release_notes: true
          prerelease: true
          body: |
            ## Automated Linux Static Build
            
            Fully static binaries - no dependencies required!
            
            Available architectures: amd64, arm64, armv7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
